[workspace]
name = "mf2005"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
version = "1.12.02"

[dependencies]
appdirs = "*"
filelock = "*"
meson = ">=1.3.1"
ninja = "*"
modflow-devtools = "*"
pytest = "*"
pytest-xdist = "*"
numpy = "*"
matplotlib = "*"
requests = "*"
flopy = "*"
gcovr = "*"
uv = "*"

[tasks]
# meson build
setup = { cmd = "meson setup --prefix=$(pwd)/builds --bindir=bin", env = { PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig" } }
build = "meson install -C"
# get ostag for system
get-ostag = { cmd = "python -c 'from modflow_devtools.ostags import get_ostag; print(get_ostag())'" }
autotest = { cmd = "pytest -v ./autotest" }
build-solution = "python scripts/build_solution.py"
test-solution = "python scripts/test_solution.py"
# dsmodern modernization tools (the ../../tools uv workspace); they read
# ./dsmodern.toml from this directory
dsaudit = "uv run --project ../../tools dsmodern audit"
dscoverage = "uv run --project ../../tools dsmodern coverage"
dsfixed2free = "uv run --project ../../tools dsmodern fixed2free"
dsmutate = "uv run --project ../../tools dsmodern mutate"
